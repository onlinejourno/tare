name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: test · syntax · dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: node --check server/*.js

      - name: Tests
        run: npm test

      - name: Dead-code / unused dependency detection
        run: npx knip

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
